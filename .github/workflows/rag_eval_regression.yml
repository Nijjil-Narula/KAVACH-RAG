name: RAG Evaluation Regression Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "kavach/evaluation/**"
      - "scripts/calibrate_judge.py"
      - "tests/test_ci_regression.py"
      - "data/calibration/**"
      - "data/processed/tier6_eval_checkpoints.jsonl"
      - "data/processed/generation_results_150.jsonl"
      - "reports/human_calibration_30.json"

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Verify evaluation artifacts are tracked
        run: |
          for f in data/processed/tier6_eval_checkpoints.jsonl data/processed/generation_results_150.jsonl reports/human_calibration_30.json; do
            test -f "$f" || { echo "Missing tracked artifact: $f"; exit 1; }
          done

      - name: Run offline regression gate
        run: python -m pytest --noconftest tests/test_ci_regression.py -v --tb=short -rA

      - name: Archive audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-reports
          path: |
            reports/human_calibration_30.json
            reports/phase4_audit_report.md
            data/processed/tier6_eval_checkpoints.jsonl
          if-no-files-found: warn
